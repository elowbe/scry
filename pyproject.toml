[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "scry-server"
version = "0.1.0"
description = "Scry - Server: game and desktop streaming for Linux and Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "aiortc>=1.10,<2",
  "av>=14,<17",
  "cryptography>=43,<50",
  "evdev>=1.7,<2; sys_platform == 'linux'",
  "PyGObject>=3.46,<3.50; sys_platform == 'linux'",
  "psutil>=6,<8",
  "pystray>=0.19,<1",
  "Pillow>=10,<13",
  "pynput>=1.7,<2; sys_platform == 'win32'",
  "vgamepad>=0.1,<1; sys_platform == 'win32'",
  "PyAudioWPatch>=0.2.12,<0.3; sys_platform == 'win32'",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
scry-server = "gamestream.cli:main"
game-stream = "gamestream.cli:main"

[tool.setuptools.packages.find]
include = ["gamestream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[tool.setuptools.package-data]
"gamestream.dlss_support" = ["LICENSE"]

[tool.setuptools.data-files]
"share/scry" = ["THIRD_PARTY_NOTICES.md"]
"share/scry/web" = ["web/index.html", "web/app.js", "web/styles.css", "web/manifest.webmanifest", "web/icon.svg", "web/icon.png"]
"share/scry/native/bin" = ["native/bin/dlss5nr_stream_host.exe", "native/bin/dlss5nr_bridge.dll", "native/bin/nvngx.dll_comfy.dll"]
"share/scry/native" = ["native/BRIDGE_LICENSE", "native/README.md", "native/dlss5nr_stream_host.cpp", "native/dlss5nr_bridge.cpp", "native/caller_shim.cpp"]
